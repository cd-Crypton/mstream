      * {

      #root {

      #app-splash-screen {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: #07070a !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 9999999 !important;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
          visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }

      #app-splash-screen.splash-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      .mstream-glowing-logo {
        color: #ff000d;
        font-size: 2.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-shadow:
          0 0 5px #e50914,
          0 0 12px #e50914,
          0 0 24px #e50914,
          0 0 45px #e50914;
        animation: pulse-glow 1.8s ease-in-out infinite;
        user-select: none;
      }

      @keyframes pulse-glow {
        0% {
          text-shadow:
            0 0 5px #e50914,
            0 0 10px #e50914,
            0 0 18px #e50914;
          transform: scale(0.98);
        }
        50% {
          text-shadow:
            0 0 8px #e50914,
            0 0 20px #e50914,
            0 0 35px #e50914,
            0 0 55px #ff2a4b;
          transform: scale(1.02);

            0 0 5px #e50914,
            0 0 10px #e50914,
            0 0 18px #e50914;

    <div id="app-splash-screen">

    </div>
    <div id="root"></div>
    <script>
      window.dismissAppSplash = function () {
        var splash = document.getElementById("app-splash-screen");
        if (!splash || splash.classList.contains("splash-hidden")) return;
        splash.classList.add("splash-hidden");
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      };

      // Fallback safety timeout if React mounting is delayed
      setTimeout(function () {
        if (typeof window.dismissAppSplash === "function") {
          window.dismissAppSplash();
        }
      }, 1800);
    </script>
